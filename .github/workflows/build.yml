name: probe-arm64e-kernel-codegen

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain inventory
        run: |
          set -x
          sw_vers
          xcodebuild -version
          xcode-select -p
          xcodebuild -showsdks
          clang --version
          echo "--- iphoneos SDK path ---"
          xcrun --sdk iphoneos --show-sdk-path
          echo "--- macosx SDK path ---"
          xcrun --sdk macosx --show-sdk-path

      - name: Attempt A -- bare arm64e triple, no SDK, -mkernel
        continue-on-error: true
        run: |
          set -x
          mkdir -p out
          clang -target arm64e-apple-ios14.0 -mkernel -fno-builtin \
            -fno-exceptions -fno-rtti -Os \
            -c src/hello.c -o out/attemptA.o
          file out/attemptA.o
          otool -hv out/attemptA.o

      - name: Attempt B -- bare arm64e triple, no SDK, no -mkernel
        continue-on-error: true
        run: |
          set -x
          clang -target arm64e-apple-ios14.0 -fno-builtin \
            -fno-exceptions -fno-rtti -Os \
            -c src/hello.c -o out/attemptB.o
          file out/attemptB.o
          otool -hv out/attemptB.o

      - name: Attempt C -- iphoneos SDK, -mkernel
        continue-on-error: true
        run: |
          set -x
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64e -isysroot "$SDK" -mios-version-min=14.0 -mkernel \
            -fno-builtin -fno-exceptions -fno-rtti -Os \
            -c src/hello.c -o out/attemptC.o
          file out/attemptC.o
          otool -hv out/attemptC.o

      - name: Attempt D -- macosx SDK cross-target arm64e-apple-ios14.0, -mkernel
        continue-on-error: true
        run: |
          set -x
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          clang -target arm64e-apple-ios14.0 -isysroot "$SDK" -mkernel \
            -fno-builtin -fno-exceptions -fno-rtti -Os \
            -c src/hello.c -o out/attemptD.o
          file out/attemptD.o
          otool -hv out/attemptD.o

      - name: Summary of what actually produced valid ARM64E Mach-O
        run: |
          set -x
          for f in out/attempt*.o; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            file "$f" || true
            otool -hv "$f" || true
            echo
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-objects
          path: out/
          if-no-files-found: warn

  kmod-hello:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Compile kmod_hello.c (kernel context, no optimization for predictable codegen)
        run: |
          set -x
          mkdir -p out2
          clang -target arm64e-apple-ios14.0 -mkernel -fno-builtin \
            -fno-exceptions -fno-rtti -O0 \
            -c src/kmod_hello.c -o out2/kmod_hello.o
          file out2/kmod_hello.o

      - name: Symbol table (need exact offset of kmod_hello_start + g_marker)
        run: |
          set -x
          nm -m out2/kmod_hello.o
          echo "--- otool -lv (section layout / sizes) ---"
          otool -lv out2/kmod_hello.o

      - name: Disassembly (sanity check -- must be free of external branches/relocations)
        run: |
          set -x
          otool -tvV out2/kmod_hello.o
          echo "--- relocation entries (must be empty or only self-referential) ---"
          otool -r out2/kmod_hello.o

      - name: Raw __TEXT,__text bytes
        run: |
          set -x
          otool -s __TEXT __text out2/kmod_hello.o

      - name: Raw __DATA,__data bytes (if any)
        run: |
          set -x
          otool -s __DATA __data out2/kmod_hello.o || echo "no __DATA,__data section"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kmod-hello-object
          path: out2/
          if-no-files-found: warn

  iokit-headers-probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Look for Kernel.framework (IOService.h etc) on macOS SDK
        run: |
          set -x
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          echo "SDK=$SDK"
          find "$SDK" -iname "IOService.h" 2>/dev/null
          find "$SDK" -iname "Kernel.framework" -maxdepth 6 2>/dev/null
          echo "--- IOKit.framework (userspace, NOT what we need for a kext) ---"
          find "$SDK" -iname "IOKit.framework" -maxdepth 6 2>/dev/null

      - name: Look on iphoneos SDK too, just in case
        run: |
          set -x
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          find "$SDK" -iname "IOService.h" 2>/dev/null
          find "$SDK" -iname "Kernel.framework" -maxdepth 6 2>/dev/null

      - name: Search the whole Xcode.app for Kernel.framework anywhere (KDK, DriverKit, etc)
        run: |
          set -x
          XC=$(xcode-select -p)
          echo "Xcode path=$XC"
          find "$XC" -iname "IOService.h" 2>/dev/null | head -20
          find "$XC" -iname "Kernel.framework" 2>/dev/null | head -20
          echo "--- DriverKit (the modern replacement -- different API, not IOKit kext C++ ABI) ---"
          find "$XC" -iname "*DriverKit*" -maxdepth 4 2>/dev/null | head -20

      - name: Is there a Kernel Debug Kit installed or downloadable via xcodebuild?
        run: |
          set -x
          xcodebuild -showsdks || true
          ls /Library/Developer/KDKs 2>&1 || echo "no /Library/Developer/KDKs"
          softwareupdate --list 2>&1 | head -30 || true

  iokit-class-probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Compile a real IOService subclass against macOS SDK's Kernel.framework, arm64e-ios target
        continue-on-error: true
        run: |
          set -x
          mkdir -p out3
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          KHDRS="$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/Headers"
          ls "$KHDRS/IOKit" | head -20
          clang++ -target arm64e-apple-ios14.0 -mkernel -fapple-kext \
            -fno-exceptions -fno-rtti -std=gnu++17 -O0 \
            -I"$KHDRS" \
            -c src/InfernoVGPUHello.cpp -o out3/InfernoVGPUHello.o
          file out3/InfernoVGPUHello.o

      - name: Symbol table + section layout (if compile succeeded)
        if: always()
        run: |
          set -x
          [ -f out3/InfernoVGPUHello.o ] || { echo "no object produced"; exit 0; }
          nm -m out3/InfernoVGPUHello.o
          echo "--- otool -lv ---"
          otool -lv out3/InfernoVGPUHello.o
          echo "--- relocations ---"
          otool -r out3/InfernoVGPUHello.o

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iokit-class-object
          path: out3/
          if-no-files-found: warn

  userspace-test-probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Compile the userspace IOServiceOpen/GetVersion test binary (real userspace, not -mkernel)
        continue-on-error: true
        run: |
          set -x
          mkdir -p out4
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -target arm64e-apple-ios14.0 -isysroot "$SDK" \
            -framework IOKit -framework CoreFoundation \
            -o out4/inferno_vgpu_test src/userspace_test/inferno_vgpu_test.c
          file out4/inferno_vgpu_test
          otool -hv out4/inferno_vgpu_test
          echo "--- linked libraries ---"
          otool -L out4/inferno_vgpu_test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: userspace-test-binary
          path: out4/
          if-no-files-found: warn

  metal-plugin-bundle:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the auto-generated stub (keeps it in sync with the checked-in class-dumps)
        run: |
          set -x
          cd metal_spi
          python3 gen_stub.py

      - name: Compile InfernoVGPUMetalDevice.m + generated stub into a real MTLDeviceSPI-conforming .dylib (iphoneOS SDK, arm64e)
        continue-on-error: true
        run: |
          set -x
          mkdir -p out5/InfernoVGPUMetal.bundle
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -target arm64e-apple-ios14.0 -isysroot "$SDK" -fobjc-arc \
            -framework Foundation -framework Metal -framework IOKit \
            -bundle -o out5/InfernoVGPUMetal.bundle/InfernoVGPUMetal \
            metal_spi/InfernoVGPUMetalDevice.m metal_spi/InfernoVGPUMetalDevice_generated.m
          cp metal_spi/Info.plist out5/InfernoVGPUMetal.bundle/Info.plist
          file out5/InfernoVGPUMetal.bundle/InfernoVGPUMetal
          otool -hv out5/InfernoVGPUMetal.bundle/InfernoVGPUMetal
          echo "--- linked libraries ---"
          otool -L out5/InfernoVGPUMetal.bundle/InfernoVGPUMetal

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-plugin-bundle
          path: out5/
          if-no-files-found: warn

  metal-probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Compile the MTLCopyAllDevices()/MTLCreateSystemDefaultDevice() probe binary
        continue-on-error: true
        run: |
          set -x
          mkdir -p out6
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -target arm64e-apple-ios14.0 -isysroot "$SDK" -fobjc-arc \
            -framework Foundation -framework Metal \
            -o out6/metal_probe src/userspace_test/metal_probe.m
          file out6/metal_probe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-probe-binary
          path: out6/
          if-no-files-found: warn

  agx-direct-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: "Compile the direct AGXPrincipalDevice initWithAcceleratorPort: probe"
        continue-on-error: true
        run: |
          set -x
          mkdir -p out7
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -target arm64e-apple-ios14.0 -isysroot "$SDK" -fobjc-arc \
            -framework Foundation -framework Metal -framework IOKit \
            -o out7/agx_direct_test src/userspace_test/agx_direct_test.m
          file out7/agx_direct_test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agx-direct-test-binary
          path: out7/
          if-no-files-found: warn

  agx-bridge-dylib:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: "Compile inferno_agx_bridge.m into a real .dylib (InfernoGetAGXDevice() C export)"
        continue-on-error: true
        run: |
          set -x
          mkdir -p out8
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -target arm64e-apple-ios14.0 -isysroot "$SDK" -fobjc-arc \
            -framework Foundation -framework Metal -framework IOKit \
            -dynamiclib -install_name /usr/lib/inferno_agx_bridge.dylib \
            -o out8/inferno_agx_bridge.dylib src/userspace_test/inferno_agx_bridge.m
          file out8/inferno_agx_bridge.dylib
          otool -hv out8/inferno_agx_bridge.dylib
          echo "--- exported symbols (need InfernoGetAGXDevice) ---"
          nm -gU out8/inferno_agx_bridge.dylib
          echo "--- linked libraries ---"
          otool -L out8/inferno_agx_bridge.dylib

      - name: "Compile test_agx_bridge.m (dlopen+dlsym harness to validate the dylib on-device before the dyld cache patch)"
        continue-on-error: true
        run: |
          set -x
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -target arm64e-apple-ios14.0 -isysroot "$SDK" -fobjc-arc \
            -framework Foundation \
            -o out8/test_agx_bridge src/userspace_test/test_agx_bridge.m
          file out8/test_agx_bridge

      - name: "Compile agx_introspect.m (live ObjC runtime method-list dump of the constructed AGXPrincipalDevice)"
        continue-on-error: true
        run: |
          set -x
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -target arm64e-apple-ios14.0 -isysroot "$SDK" -fobjc-arc \
            -framework Foundation \
            -o out8/agx_introspect src/userspace_test/agx_introspect.m
          file out8/agx_introspect

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agx-bridge-dylib
          path: out8/
          if-no-files-found: warn
